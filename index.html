<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday, Stella Halim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <audio
        id="background-music"
        src="birthday-music.mp3"
        loop>
    </audio>


    <section id="opening" class="scene active">

        <div class="stars"></div>

        <div class="opening-content">

            <img
                src="stella-photo-1.jpeg"
                alt="Stella"
                class="stella-photo">

            <p class="small-intro">
                happy birthday
            </p>

            <h1>
                stella halim
            </h1>

            <p class="age">
                20 years old
            </p>

            <p class="opening-message">
                dear my chihuahua,<br>
                here begins the adventure.
            </p>

            <button id="begin-button">
                start the adventure
            </button>

        </div>

    </section>


    <section id="personal-quiz" class="scene">

        <div class="quiz-container">

            <p id="personal-question-number">
                question 1
            </p>

            <div class="question-progress">
                <div
                    id="personal-progress-bar"
                    class="progress-bar">
                </div>
            </div>

            <p id="personal-progress-current">
                1
            </p>

            <h2 id="personal-question"></h2>

            <div id="personal-answer-area"></div>

            <button
                id="personal-next-button"
                disabled>
                next
            </button>

        </div>

    </section>


    <section id="mbti-quiz" class="scene">

        <div class="quiz-container">

            <p id="mbti-question-number">
                question 1 of 20
            </p>

            <div class="question-progress">
                <div
                    id="mbti-progress-bar"
                    class="progress-bar">
                </div>
            </div>

            <p id="mbti-progress-current">
                1
            </p>

            <h2 id="mbti-question"></h2>

            <div id="mbti-answer-area"></div>

            <button
                id="mbti-next-button"
                disabled>
                next
            </button>

        </div>

    </section>


    <section id="second-photo" class="scene">

        <div class="photo-scene">

            <img
                src="stella-photo-2.jpeg"
                alt="Stella"
                class="second-stella-photo">

            <p>
                now let's see what your answers say about you.
            </p>

            <button id="photo-continue-button">
                see your personality
            </button>

        </div>

    </section>


    <section id="mbti-result" class="scene">

        <div class="result-container">

            <p>
                your personality
            </p>

            <h1 id="mbti-type"></h1>

            <h2 id="mbti-title"></h2>

            <p id="mbti-description"></p>

            <p id="mbti-details"></p>

            <button id="result-continue-button">
                continue
            </button>

        </div>

    </section>


    <section id="shiba-scene" class="scene">

        <div class="shiba-container">

            <img
                src="shiba.jpg"
                alt="Shibainu holding a birthday cake"
                class="shiba-image">

            <h2>
                one last thing...
            </h2>

            <p>
                from your shibainu.
            </p>

            <button id="wishes-button">
                read my wishes
            </button>

        </div>

    </section>


    <section id="birthday-wishes" class="scene">

        <div class="wishes-container">

            <div id="wishes-text"></div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
