<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Chihuahua</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="birthday-app">
        <!-- ================================
             SCENE 1 — OPENING
        ================================= -->
        <section id="opening" class="scene active">
            <div class="night-sky">
                <div class="stars"></div>
                <div class="opening-content">
                    <div class="photo-frame">
                        <img
                            src="stella-photo-1.jpeg"
                            alt="Birthday photo"
                        >
                    </div>
                    <div class="opening-text">
                        <p class="small-title">Happy Birthday</p>
                        <h1>My Chihuahua</h1>
                        <p class="age">20</p>
                    </div>
                    <button id="begin-button">
                        Begin the Adventure
                    </button>
                </div>
            </div>
        </section>
        <!-- ================================
             SCENE 2 — SHIBA INU
        ================================= -->
        <section id="shiba-scene" class="scene">
            <div class="shiba-container">
                <div id="shiba-character">
                    <!-- Shiba Inu SVG will be added later -->
                </div>
                <div class="cake-container">
                    <!-- Birthday cake will be added later -->
                </div>
                <div class="scene-text">
                    <p id="shiba-message"></p>
                </div>
            </div>
        </section>
        <!-- ================================
             SCENE 3 — PERSONAL QUESTIONS
        ================================= -->
        <section id="personal-quiz" class="scene">
            <div class="quiz-container">
                <p class="quiz-label">A little something about you</p>
                <h2 id="personal-question-number">
                    Question 1
                </h2>
                <div id="personal-question">
                    <!-- Question will be inserted by JavaScript -->
                </div>
                <div id="personal-answer-area">
                    <!-- Answers will be inserted by JavaScript -->
                </div>
                <button id="personal-next-button">
                    Continue
                </button>
            </div>
        </section>
        <!-- ================================
             SCENE 4 — MBTI TEST
        ================================= -->
        <section id="mbti-quiz" class="scene">
            <div class="quiz-container">
                <p class="quiz-label">A little more about your personality</p>
                <h2 id="mbti-question-number">
                    Question 1 of 20
                </h2>
                <div id="mbti-question">
                    <!-- MBTI question will be inserted by JavaScript -->
                </div>
                <div id="mbti-answer-area">
                    <!-- MBTI answers will be inserted by JavaScript -->
                </div>
                <button id="mbti-next-button">
                    Continue
                </button>
            </div>
        </section>
        <!-- ================================
             SCENE 5 — MBTI RESULT
        ================================= -->
        <section id="mbti-result" class="scene">
            <div class="result-container">
                <p class="result-label">
                    Your personality
                </p>
                <h2 id="mbti-type">
                    INFJ
                </h2>
                <h3 id="mbti-title">
                    <!-- Personality title -->
                </h3>
                <p id="mbti-description">
                    <!-- Personality description -->
                </p>
                <div id="mbti-details">
                    <!-- Personality details -->
                </div>
                <button id="birthday-ending-button">
                    Continue
                </button>
            </div>
        </section>
        <!-- ================================
             SCENE 6 — BIRTHDAY WISHES
        ================================= -->
        <section id="birthday-wishes" class="scene">
            <div class="wishes-container">
                <p class="wishes-label">
                    For you
                </p>
                <h2>
                    Happy Birthday
                </h2>
                <div id="wishes-text">
                    <!-- Your long birthday wishes will go here -->
                </div>
            </div>
        </section>
    </main>
    <!-- Background music -->
    <audio
        id="background-music"
        src="birthday-music.mp3"
        loop
        preload="auto">
    </audio>
    <script src="script.js"></script>
</body>
</html>
